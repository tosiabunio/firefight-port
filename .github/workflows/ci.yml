name: CI

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '0 3 * * *'   # nightly: includes macOS
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which platforms run when. macOS runner minutes cost a multiple of Linux minutes:
  #   push to a branch         -> Windows + Linux (with the Emscripten builds: Node, browser)
  #   pull request             -> macOS only (the push run already covers Windows + Linux
  #                               for the same commit, and its checks show on the PR)
  #   push to main, nightly,
  #   manual run               -> everything
  # Day-to-day macOS testing happens on a local Mac.
  matrix:
    runs-on: ubuntu-24.04   # pinned like the Linux builds (ubuntu-latest moves to Ubuntu 26)
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - id: set
        shell: bash
        run: |
          winlinux='[{"preset":"windows-msvc","os":"windows-latest"},{"preset":"linux-gcc","os":"ubuntu-24.04"},{"preset":"linux-clang","os":"ubuntu-24.04"},{"preset":"node-emscripten","os":"ubuntu-24.04"}]'
          macos='[{"preset":"macos-clang","os":"macos-latest"}]'
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            m="$macos"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            m="$winlinux"
          else
            m=$(jq -c --argjson a "$winlinux" --argjson b "$macos" -n '$a + $b')
          fi
          echo "include=$m" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          preset: ${{ matrix.preset }}

      - name: Configure, build and test (Debug + Release)
        run: cmake --workflow --preset ${{ matrix.preset }}

      # The browser build (phase 9) has no tests of its own: the node build above runs them.
      - name: Build for the browser (Debug + Release)
        if: matrix.preset == 'node-emscripten'
        run: cmake --workflow --preset web-emscripten

      - name: Upload vcpkg logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vcpkg-logs-${{ matrix.preset }}
          path: |
            ${{ env.VCPKG_ROOT }}/buildtrees/*/*.log
            build/${{ matrix.preset }}/vcpkg-manifest-install.log
          if-no-files-found: ignore
